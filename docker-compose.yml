version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: new-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass123
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-log:
    image: postgres:16-alpine
    container_name: new-api-postgres-log
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpass123
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "5433:5432"
    volumes:
      - postgres_log_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  postgres_log_data:
    driver: local

networks:
  new-api-network:
    driver: bridge
